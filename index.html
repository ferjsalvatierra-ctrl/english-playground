<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>English Playground</title>
<style>
/* Direction: sticker-book classroom. Thick ink outlines, hard offset shadows, one bright colour per topic. */
:root{
  --ink:#17203a; --bg:#e8f2ff; --card:#ffffff; --sun:#ffd23f; --good:#1fb36a; --bad:#ff5a5f;
  --c:#2d6cf6; --c2:#dce7ff;
  --fd:"Baloo 2","Fredoka","Segoe UI",ui-rounded,system-ui,sans-serif;
  --fb:"Nunito","Segoe UI",ui-rounded,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background-color:var(--bg);
  background-image:radial-gradient(#c9dcff 2.5px,transparent 2.5px);background-size:28px 28px;
  color:var(--ink);font:800 20px/1.35 var(--fb);color-scheme:light;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none;
}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--fd);margin:0;line-height:1.1}

/* top bar */
#top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:4px solid var(--ink);display:flex;align-items:center;gap:14px;padding:10px 18px}
.brand{font:800 26px/1 var(--fd);display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{font-style:normal;background:var(--sun);border:3px solid var(--ink);border-radius:12px;padding:2px 8px}
.bar{flex:1;height:22px;background:#fff;border:3px solid var(--ink);border-radius:14px;overflow:hidden;min-width:80px}
.bar b{display:block;height:100%;width:0;background:var(--good);transition:width .5s}
.pill{border:3px solid var(--ink);border-radius:14px;background:var(--sun);padding:4px 12px;font:800 20px var(--fd);white-space:nowrap}
.tb{width:48px;height:48px;border:3px solid var(--ink);border-radius:14px;background:#fff;font-size:24px;box-shadow:0 4px 0 var(--ink);padding:0}
.tb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

#view{max-width:1080px;margin:0 auto;padding:22px 18px 80px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:10px;min-height:56px;padding:8px 26px;background:var(--c);color:#fff;border:3px solid var(--ink);border-radius:18px;font:800 24px var(--fd);box-shadow:0 6px 0 var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:#fff;color:var(--ink);text-shadow:none}
.btn.go{background:var(--good)}
.btn[disabled]{opacity:.45}

/* cards */
.card{background:var(--card);border:4px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink)}

/* home */
.hero{padding:30px 34px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;background:var(--sun)}
.hero h1{font-size:clamp(34px,5vw,56px)}
.hero p{margin:10px 0 18px;font-size:22px;max-width:34em}
.hero .big{font-size:clamp(70px,12vw,140px);line-height:1}
.facts{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 20px;padding:0;list-style:none}
.facts li{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:4px 14px;font-size:18px}
.sec{margin:34px 0 12px;font:800 30px var(--fd);display:flex;align-items:center;gap:12px}
.sec small{font:800 18px var(--fb);opacity:.7}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.tile{--c:#2d6cf6;text-align:left;background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:12px 14px;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.tile::before{content:"";position:absolute;left:0;top:0;right:0;height:10px;background:var(--c)}
.tile .e{font-size:42px;margin-top:8px;line-height:1.1}
.tile .n{font:800 22px/1.1 var(--fd)}
.tile .s{font-size:18px;color:#5a6788}
.tile.done{background:#eafaf1}
.tile.done::after{content:"✔";position:absolute;right:10px;top:16px;width:34px;height:34px;border-radius:50%;background:var(--good);color:#fff;border:3px solid var(--ink);display:grid;place-items:center;font-size:18px}

/* topic colours */
.c0{--c:#2d6cf6;--c2:#dce7ff}.c1{--c:#1fa971;--c2:#d6f5e6}.c2{--c:#ff7b1c;--c2:#ffe4cf}
.c3{--c:#e23d8f;--c2:#ffdcec}.c4{--c:#7b4dff;--c2:#e6dcff}.c5{--c:#0aa5b5;--c2:#d0f2f5}

/* topic screen */
.thero{background:var(--c);color:#fff;padding:22px 30px;display:flex;align-items:center;gap:22px;justify-content:space-between}
.thero .tk{font:800 18px var(--fd);letter-spacing:.08em;text-transform:uppercase;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:12px;display:inline-block;padding:2px 12px;margin-bottom:10px}
.thero h2{font-size:clamp(34px,5vw,54px);text-shadow:0 3px 0 rgba(0,0,0,.25)}
.thero .temo{font-size:clamp(60px,10vw,110px);line-height:1;filter:drop-shadow(0 5px 0 rgba(0,0,0,.25))}
.about{margin:22px 0 10px;background:var(--c2);padding:18px 24px;border-radius:22px;border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink)}
.about h4{font-size:24px;margin-bottom:6px}
.about p{margin:0 0 10px;font-weight:700}
.tip{background:#fff;border:3px dashed var(--ink);border-radius:16px;padding:10px 16px;font-size:20px}
.tip table{border-collapse:collapse;width:100%}
.tip td,.tip th{padding:3px 10px;text-align:left;border-bottom:2px solid #e3e9f7}
.tip th{font-family:var(--fd);color:var(--c)}
.tip b{color:var(--c)}
.ex{margin:30px 0;background:#fff;border:4px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);overflow:hidden}
.ex.complete{box-shadow:0 8px 0 var(--good);border-color:var(--ink)}
.exh{display:flex;align-items:center;gap:14px;background:var(--c2);padding:12px 18px;border-bottom:4px solid var(--ink)}
.exh h3{flex:1;font-size:26px}
.num{width:44px;height:44px;flex:none;border-radius:50%;background:var(--c);color:#fff;border:3px solid var(--ink);display:grid;place-items:center;font:800 24px var(--fd)}
.stars{font-size:30px;color:#f5a400;letter-spacing:2px;text-shadow:0 2px 0 var(--ink);white-space:nowrap}
.exb{padding:18px 20px 22px;position:relative}
.nav{display:flex;justify-content:space-between;gap:14px;margin-top:34px}

/* chips and slots */
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:54px;padding:6px 18px;background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);font:800 24px var(--fb);touch-action:none;cursor:grab;margin:6px}
.chip.big{font-size:26px;min-width:120px;min-height:76px}
.chip.sel{background:var(--sun);transform:translateY(-3px)}
.chip.dragging{opacity:.3}
.chip.used{visibility:hidden;pointer-events:none}
.chip.placed,.chip.done{cursor:default;box-shadow:none;margin:4px}
.chip.placed{background:#d9f7e6;border-color:var(--good)}
.ghost{position:fixed;left:0;top:0;margin:0;pointer-events:none;z-index:99;box-shadow:0 12px 20px rgba(0,0,0,.3)}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:120px;min-height:54px;padding:6px 18px;border:3px dashed #8b97b8;border-radius:16px;background:#f7f9ff;font:800 24px var(--fb);margin:6px;vertical-align:middle}
.slot.big{min-height:76px;font-size:24px;text-align:center}
.slot.hot,.bucket.hot{background:var(--sun);border-color:var(--ink)}
.slot.sel{background:var(--sun);border-color:var(--ink)}
.slot.ok{border:3px solid var(--good);background:#d9f7e6;color:#0b7a44}
.tray{display:flex;flex-wrap:wrap;justify-content:center;min-height:70px;margin-top:10px;padding:8px;border-radius:18px;background:var(--c2)}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.hint{font-size:17px;color:#5a6788;font-weight:700}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px 40px;align-items:start}
.mcol{display:flex;flex-direction:column;align-items:stretch}
.mcol .chip,.mcol .slot{margin:7px 0;width:100%}
.mcol .slot{border-style:solid;border-color:#8b97b8}
.p0{background:#ffd9d9!important}.p1{background:#d9ecff!important}.p2{background:#fff1b8!important}
.p3{background:#d9f7e6!important}.p4{background:#ead9ff!important}.p5{background:#ffe3c8!important}
.done.p0,.done.p1,.done.p2,.done.p3,.done.p4,.done.p5{border:3px solid var(--ink);border-style:solid;color:var(--ink);box-shadow:none}

/* sort */
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.bucket{border:4px solid var(--ink);border-radius:20px;background:var(--c2);padding:10px;min-height:150px}
.bucket h4{font-size:26px;text-align:center;margin-bottom:4px}
.bin{display:flex;flex-wrap:wrap;justify-content:center;min-height:60px}

/* multiple choice */
.passage{background:#fffbe6;border:3px solid var(--ink);border-radius:18px;padding:14px 20px;margin-bottom:16px;font-size:22px;line-height:1.5}
.passage svg{max-width:100%;height:auto;max-height:260px}
.qcard{border:3px solid var(--ink);border-radius:20px;padding:12px 16px;margin:12px 0;background:#fff}
.qcard.ok{background:#f0fbf5}
.qimg{text-align:center;font-size:56px;line-height:1.1;margin-bottom:6px}
.qimg svg{max-width:100%;height:auto;max-height:210px}
.qtext{font-size:24px;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{min-height:56px;padding:6px 20px;border:3px solid var(--ink);border-radius:16px;background:#fff;box-shadow:0 4px 0 var(--ink);font:800 23px var(--fb)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opt.good{background:var(--good);color:#fff}
.opt.bad{background:#ffd1d3;opacity:.7;text-decoration:line-through}
.opt svg{height:76px;width:auto;display:block}
.spk{border:3px solid var(--ink);background:var(--sun);border-radius:14px;padding:4px 14px;box-shadow:0 4px 0 var(--ink);margin-right:10px;font:800 22px var(--fb)}

/* fill */
.fline{font-size:26px;line-height:2.2;margin:2px 0}
.fline .ico{font-size:34px;margin-right:6px}
.blank{min-width:110px;min-height:46px;margin:0 4px;padding:0 12px}

/* type */
.trow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:10px 0;padding:10px 14px;border:3px solid var(--ink);border-radius:18px}
.trow .ico{font-size:46px;line-height:1}
.trow .q{font-size:24px;flex:1 1 220px}
.trow input{width:230px;height:56px;border:3px solid var(--ink);border-radius:14px;padding:0 14px;font:800 24px var(--fb);background:#fff}
.trow.ok{background:#e7faef}.trow.ok input{background:#d9f7e6;border-color:var(--good)}
.trow.reveal input{background:#fff1d6}
.trow .hint{flex-basis:100%}

/* write */
textarea{width:100%;min-height:130px;border:3px solid var(--ink);border-radius:16px;padding:12px 16px;font:800 24px/1.4 var(--fb);resize:vertical}
.checks{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chk{border:3px solid var(--ink);border-radius:14px;padding:4px 14px;background:#fff;font-size:20px}
.chk.on{background:#d9f7e6}
.chk.on::before{content:"✔ "}
.model{margin-top:14px;background:#e7faef;border:3px solid var(--good);border-radius:16px;padding:12px 18px;font-size:22px}
.line{min-height:64px;border:3px dashed #8b97b8;border-radius:16px;background:#f7f9ff;display:flex;flex-wrap:wrap;align-items:center;padding:4px;margin:6px 0}
.line.ok{border:3px solid var(--good);background:#d9f7e6}
.ordq{margin:14px 0 20px;padding-bottom:6px}

/* end */
.endgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:16px}
.endgrid div{border:3px solid var(--ink);border-radius:14px;padding:6px 10px;background:#fff;font-size:18px}
.confetti{position:absolute;left:50%;top:50%;font-size:34px;pointer-events:none;animation:fly 1.1s ease-out forwards;z-index:5}
@keyframes fly{from{transform:translate(0,0) scale(.5);opacity:1}to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1.2);opacity:0}}
@media (max-width:640px){.hero{grid-template-columns:1fr}.match{gap:6px 14px}.brand span{display:none}.chip{font-size:20px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== v2 additions ===== */
.pill.grade{background:#fff;display:flex;align-items:baseline;gap:4px}
.pill.grade b{font-size:26px}.pill.grade small{font:800 14px var(--fb);opacity:.7}
.pill.grade.g-hi{background:#bff0d4}.pill.grade.g-mid{background:#fff0a8}.pill.grade.g-lo{background:#ffd6c2}
.scorebox{display:flex;align-items:center;gap:18px;margin:18px 0 0;padding:14px 22px;border:4px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);background:#fff}
.scorebox .face{font-size:64px;line-height:1}.scorebox .big{font:800 28px var(--fd)}.scorebox .big b{font-size:40px}.scorebox .sm{font-size:19px;color:#4a587a}
.scorebox.g-hi{background:#e3f9ec}.scorebox.g-mid{background:#fff8d6}.scorebox.g-lo{background:#fff0e8}
/* bigger pictures */
.em{font-size:1.7em;line-height:1;vertical-align:-.12em;margin-right:4px}
.chip.pic,.slot.pic{font-size:78px!important;line-height:1;min-height:116px!important;padding:4px 10px}
.chip.big{font-size:28px}.mcol .slot.big{font-size:28px;min-height:116px}
.qimg{font-size:104px}
.qimg svg{max-height:300px}
.fline .ico{font-size:66px;vertical-align:middle;line-height:1}
.fline{line-height:2.4}
.trow .ico{font-size:88px}
.opt svg{height:120px}
.opt .em{font-size:2em}
.tile .e{font-size:58px}
.bucket h4 .em{font-size:1.5em}
.chip .em{font-size:2em}
.passage svg{max-height:340px}
/* check row under every exercise */
.exf{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 20px;border-top:4px solid var(--ink);background:#f4f7ff}
.exf .dots{display:flex;gap:8px;flex-wrap:wrap}
.dot{width:38px;height:38px;border:3px solid var(--ink);border-radius:50%;background:#fff;display:grid;place-items:center;font-size:21px;color:#fff;font-weight:800}
.dot.on{background:var(--good)}
.fmid{display:flex;gap:12px;align-items:center;font-size:20px;flex:1;min-width:140px}
.fmid .mis{background:#ffd1d3;border:3px solid var(--ink);border-radius:12px;padding:0 10px}
.sc{font:800 24px var(--fd);border:3px solid var(--ink);border-radius:14px;padding:2px 14px;background:#fff}
.sc.g-hi{background:#bff0d4}.sc.g-mid{background:#fff0a8}.sc.g-lo{background:#ffd6c2}
.best{font-size:17px;color:#5a6788}
.btn.redo{min-height:50px;font-size:22px;background:#ff7b1c}
.ex.complete .exf{background:#eafaf1}
.st{color:#cfd6e8;text-shadow:0 2px 0 var(--ink)}.st.on{color:#f5a400}
/* check marks on solved items */
.chip.placed::after,.chip.done::after,.slot.done::after,.slot.ok::after,.trow.ok .q::after,.line.ok::after{content:" ✔";color:var(--good);font-weight:800}
.chip.done::after,.slot.done::after{position:absolute;right:10px;top:4px;font-size:26px}
.chip.done,.slot.done{position:relative}
.qcard.ok{position:relative}.qcard.ok::after{content:"✔";position:absolute;right:12px;top:8px;width:40px;height:40px;border-radius:50%;background:var(--good);color:#fff;border:3px solid var(--ink);display:grid;place-items:center;font-size:22px}
.rowchk{width:56px;height:56px;border:3px solid var(--ink);border-radius:14px;background:var(--good);color:#fff;font:800 30px var(--fd);box-shadow:0 4px 0 var(--ink);padding:0}
.rowchk:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}.rowchk[disabled]{opacity:.35}
.tile .left{position:absolute;right:10px;top:16px;background:var(--sun);border:3px solid var(--ink);border-radius:12px;padding:0 8px;font:800 15px var(--fb)}
.tile.done .left{display:none}
/* parents */
details.parents{margin:18px 0;background:#fff;border:4px dashed var(--ink);border-radius:22px;padding:6px 18px;font-weight:700;-webkit-user-select:text;user-select:text}
details.parents>summary{cursor:pointer;font:800 24px var(--fd);padding:10px 0;list-style:none}
details.parents>summary::before{content:"▸ ";}details.parents[open]>summary::before{content:"▾ ";}
details.parents h5{font:800 21px var(--fd);margin:14px 0 4px;color:var(--c,#2d6cf6)}
details.parents p,details.parents li{font-size:19px;line-height:1.45;margin:4px 0}
details.parents .sol{border-top:2px solid #e3e9f7;margin-top:8px}
details.parents details{margin:8px 0;background:#f7f9ff;border:3px solid var(--ink);border-radius:14px;padding:4px 14px}
details.parents details summary{font:800 19px var(--fb);cursor:pointer;padding:6px 0}
.sol ul{margin:4px 0 8px;padding-left:22px}.sol svg{height:48px;width:auto;vertical-align:middle}
.sol .ans{color:#0b7a44;font-weight:800}.sol .note{background:#fff8d6;border-radius:10px;padding:4px 10px;display:block;margin:6px 0}
.ptab{border-collapse:collapse;width:100%;font-size:18px}.ptab td,.ptab th{border-bottom:2px solid #e3e9f7;padding:4px 8px;text-align:left}
.pbtns{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.pbtns .btn{min-height:46px;font-size:19px}
details.parents textarea{min-height:70px;font-size:15px;font-weight:600}

/* players, gate, footer */
.tb.who{width:auto;max-width:170px;padding:0 14px;font:800 18px var(--fb);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-list{display:flex;flex-wrap:wrap;gap:16px;margin:24px 0}.who-btn{font-size:30px;min-height:84px;padding:8px 30px}
.who-new{padding:18px 24px;margin-top:10px}.who-new h3{font-size:28px;margin-bottom:4px}
.who-new input[type=text],.pgate input{height:56px;border:3px solid var(--ink);border-radius:14px;padding:0 14px;font:800 24px var(--fb);background:#fff;width:230px}
.who-leg{display:flex;align-items:center;gap:10px;font-size:19px;margin:8px 0}.who-leg input{width:28px;height:28px}
.pgate{margin:6px 0 10px}
@media (max-width:900px){.brand span{display:none}.pill.grade small:first-child{display:none}#top{gap:10px;padding:10px 12px}}
.tb{flex:none}
.foot{margin:40px 0 0;font-size:15px;color:#5a6788;text-align:center;font-weight:700}
</style>
</head>
<body>
<div id="top">
  <div class="brand"><i>EN</i><span>English Playground</span></div>
  <div class="bar" role="progressbar" aria-label="Progress"><b id="prog"></b></div>
  <div class="pill grade" id="gradePill"><small>Score</small> <b>–</b><small>/10</small></div>
  <div class="pill" id="starTotal">★ 0</div>
  <button class="tb who" id="who" aria-label="Change player">👤</button>
  <button class="tb" id="homeBtn" aria-label="Map of topics">🗺️</button>
  <button class="tb" id="sndBtn" aria-label="Sound on or off">🔊</button>
</div>
<main id="view"></main>
<script src="engine.js?v=3"></script>
<script src="parents.js?v=3"></script>
<script src="words.js?v=3"></script>
<script src="grammar.js?v=3"></script>
</body>
</html>
